<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obbyrants30 — Official Channel Hub</title>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #141923;
      --surface-2: #1c2333;
      --border: #2a3449;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.25);
      --radius: 14px;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.bg-grid {
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 20px;
    }

    .status-banner {
      display: none;
      margin-bottom: 18px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #ef4444;
      background: rgba(239, 68, 68, 0.14);
      color: #fecaca;
      font-size: 0.9rem;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .status-banner.visible { display: flex; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.2rem;
      color: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-info h1 {
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .owner-chip {
      font-size: 0.7rem;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .sub-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 10px;
      border-radius: 999px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sub-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    .sub-dot.syncing { background: #eab308; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-success {
      background: rgba(34, 197, 94, 0.16);
      border-color: #22c55e;
      color: #86efac;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
      border-radius: 8px;
    }

    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .hero-tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .hero h2 {
      font-size: 1.85rem;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--muted);
      max-width: 680px;
      margin-bottom: 18px;
    }

    .milestone-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 12px;
      max-width: 500px;
    }

    .milestone-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 50.2%;
      transition: width 0.4s ease;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .feed-list, .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 270px;
      overflow-y: auto;
    }

    .feed-item {
      background: var(--surface-2);
      border-left: 3px solid var(--accent);
      padding: 12px 14px;
      border-radius: 8px;
    }

    .feed-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    input, textarea, select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.9rem;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    .list-entry {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .list-entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .tag-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
    }

    .upvote-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .upvote-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.open { display: grid; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .auth-box {
      max-width: 430px;
      text-align: center;
    }

    .auth-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .auth-box h3 { margin-bottom: 8px; font-size: 1.3rem; }
    .auth-box p { color: var(--muted); font-size: 0.92rem; margin-bottom: 18px; }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 20px;
      font-weight: 600;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .admin-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .tab-btn {
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .admin-stats-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-mini {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-mini strong {
      display: block;
      font-size: 1.1rem;
      color: var(--text);
    }

    .stat-mini span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .setting-group {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .setting-group h4 {
      font-size: 0.88rem;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
